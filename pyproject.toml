[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[project]
name = "pyskel"
version = "0.0.1"
description = "pyskel"
readme = "README.md"
authors = [
    { name = "wrmsr" },
]

requires-python = ">=3.14"

dependencies = [
    "omcore[cext,mypyc,plus]>=0.0.74",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "omdev>=0.0.74",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.6",
]


##
# uv

[tool.uv]
exclude-newer = "3 days"

[tool.uv.exclude-newer-package]
omcore = false
omcore-cext = false
omcore-mypyc = false
omdev = false

cryptography = false
librt = false

ruff = false
mypy = false

[tool.uv.build-backend]
module-root = ""
wheel-exclude = ["**/conftest.py", "conftest.py"]


##
# pytest

[tool.pytest.ini_options]
addopts = [
    '-v',

    '--tb=short',
    # '--showlocals',

    '--strict-markers',

    '--durations=5',
    '--durations-min=2',

    # '--log=info',
]

junit_family = 'xunit2'
junit_duration_report = 'call'

# pytest-timeout
timeout = 60
session_timeout = 600


##
# ruff

[tool.ruff]
target-version = 'py314'
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ['ALL']

ignore = [

    'RUF036',  # none-not-at-end-of-union

    'A005',      # stdlib-module-shadowing
    'ANN001',    # missing-type-function-argument
    'ANN002',    # missing-type-args
    'ANN003',    # missing-type-kwargs
    'ANN201',    # missing-return-type-undocumented-public-function
    'ANN202',    # missing-return-type-private-function
    'ANN204',    # missing-return-type-special-method
    'ANN205',    # missing-return-type-static-method
    'ANN206',    # missing-return-type-class-method
    'ANN401',    # any-type
    'ARG001',    # unused-function-argument
    'ARG002',    # unused-method-argument
    'ARG005',    # unused-lambda-argument
    'ASYNC109',  # async-function-with-timeout
    'ASYNC115',  # async-zero-sleep (bugged)
    'B008',      # function-call-in-default-argument
    'B009',      # get-attr-with-constant
    'B010',      # set-attr-with-constant
    'B023',      # function-uses-loop-variable
    'B027',      # empty-method-without-abstract-decorator
    'B028',      # no-explicit-stacklevel
    'B905',      # zip-without-explicit-strict
    'B911',      # batched-without-explicit-strict
    'C408',      # unnecessary-collection-call
    'C420',      # unnecessary-dict-comprehension-for-iterable
    'C901',      # complex-structure
    'CPY001',    # missing-copyright-notice-cpy001
    'D',         # docstrings
    'E731',      # lambda-assignment
    'E741',      # ambiguous-variable-name
    'E742',      # ambiguous-class-name
    'EM101',     # raw-string-in-exception
    'EM102',     # f-string-in-exception
    'ERA001',    # commented-out-code
    'F541',      # f-string-missing-placeholders
    'FA102',     # future-required-type-annotation
    'FBT001',    # boolean-type-hint-positional-argument
    'FBT002',    # boolean-default-value-positional-argument
    'FBT003',    # boolean-positional-value-in-call
    'FIX',       # fixmes
    'FLY002',    # static-join-to-f-string
    'FURB122',   # for-loop-writes
    'FURB136',   # if-expr-min-max
    'ICN001',    # unconventional-import-alias
    'N804',      # invalid-first-argument-name-for-class-method
    'PERF203',   # try-except-in-loop
    'PERF401',   # manual-list-comprehension
    'PGH003',    # blanket-type-ignore
    'PGH004',    # blanket-noqa
    'PLC0206',   # dict-index-missing-items
    'PLC0208',   # iteration-over-set
    'PLC0415',   # import-outside-top-level
    'PLR0911',   # too-many-return-statements
    'PLR0912',   # too-many-branches
    'PLR0913',   # too-many-arguments
    'PLR0915',   # too-many-statements
    'PLR0917',   # too-many-positional-arguments
    'PLR1714',   # repeated-equality-comparison
    'PLR1730',   # if-stmt-min-max
    'PLR2004',   # magic-value-comparison
    'PLR2044',   # empty-comment
    'PLR5501',   # collapsible-else-if
    'PLW0108',   # unnecessary-lambda
    'PLW0603',   # global-statement
    'PLW2901',   # redefined-loop-name
    'PT009',     # pytest-unittest-assertion (lite tests use unittest)
    'PT016',     # pytest-fail-without-message
    'PT018',     # pytest-composite-assertion
    'PT027',     # pytest-unittest-raises-assertion (lite tests use unittest)
    'PTH',       # pathlib
    'PYI019',    # custom-type-var-for-self
    'PYI061',    # redundant-none-literal
    'Q003',      # avoidable-escaped-quote
    'RET504',    # unnecessary-assign
    'RET505',    # superfluous-else-return
    'RET506',    # superfluous-else-raise
    'RET507',    # superfluous-else-continue
    'RET508',    # superfluous-else-break
    'RUF001',    # ambiguous-unicode-character-string
    'RUF009',    # function-call-in-dataclass-default-argument
    'RUF018',    # assignment-in-assert
    'RUF023',    # unsorted-dunder-slots
    'RUF059',    # unused-unpacked-variable
    'RUF100',    # unused-noqa
    'S102',      # exec-builtin
    'S311',      # suspicious-non-cryptographic-random-usage
    'S603',      # subprocess-without-shell-equals-true
    'S604',      # call-with-shell-equals-true
    'S606',      # start-process-with-no-shell
    'S607',      # start-process-with-partial-path
    'SIM102',    # collapsible-if
    'SIM103',    # needless-bool
    'SIM105',    # suppressible-exception
    'SIM108',    # if-else-block-instead-of-if-exp
    'SIM114',    # if-with-same-arms
    'SIM117',    # multiple-with-statements
    'SIM300',    # yoda-conditions
    'T201',      # print
    'T203',      # p-print
    'TC001',     # typing-only-first-party-import
    'TC002',     # typing-only-third-party-import
    'TC003',     # typing-only-standard-library-import
    'TC006',     # runtime-cast-value
    'TD001',     # invalid-todo-tag
    'TD002',     # missing-todo-author
    'TD003',     # missing-todo-link
    'TD004',     # missing-todo-colon
    'TD005',     # missing-todo-description
    'TID252',    # relative-imports
    'TRY002',    # raise-vanilla-class
    'TRY003',    # raise-vanilla-args
    'TRY203',    # useless-try-except
    'TRY300',    # try-consider-else
    'TRY301',    # raise-within-try

    # FIXME: mypy error: PEP 695 type aliases are not yet supported
    'UP040',  # non-pep695-type-alias

    # TODO:
    'ASYNC240',  # blocking-path-method-in-async-function
    'UP046',     # non-pep695-generic-class
    'UP047',     # non-pep695-generic-function

]

[tool.ruff.lint.per-file-ignores]
'**/__about__.py' = [
    'RUF012',  # mutable-class-default
]
'**/__init__.py' = [
    'F401',  # unused-import
]
'**/conftest.py' = [
    'F401',  # unused-import
    'I001',  # unsorted-imports
]
'**/tests/*' = [
    'B011',  # assert-false
    'S101',  # assert
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2

# [tool.ruff.format]
# quote-style = 'single'
# indent-style = 'space'


##
# mypy

[tool.mypy]
# ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
# verbosity = 1

check_untyped_defs = true

